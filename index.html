    &lt;script&gt;
      /* ===== Withdrawal demo ===== */
      (function(){
        const config={maxRows:5,addInterval:3000,completeTime:{min:1200,max:2500}};
        const banks=[
          {code:&quot;KBANK&quot;,img:&quot;https://raw.githubusercontent.com/casperstack/thai-banks-logo/master/icons/KBANK.png&quot;,fallback:&quot;assets/banks/KBANK.svg&quot;,weight:50},

          {code:&quot;KTB&quot;,img:&quot;https://raw.githubusercontent.com/casperstack/thai-banks-logo/master/icons/KTB.png&quot;,fallback:&quot;assets/banks/KTB.svg&quot;,weight:4},
          {code:&quot;BBL&quot;,img:&quot;https://raw.githubusercontent.com/casperstack/thai-banks-logo/master/icons/BBL.png&quot;,fallback:&quot;assets/banks/BBL.svg&quot;,weight:4},
          {code:&quot;BAY&quot;,img:&quot;https://raw.githubusercontent.com/casperstack/thai-banks-logo/master/icons/BAY.png&quot;,fallback:&quot;assets/banks/BAY.svg&quot;,weight:4},
          {code:&quot;TTB&quot;,img:&quot;https://raw.githubusercontent.com/casperstack/thai-banks-logo/master/icons/TTB.png&quot;,fallback:&quot;assets/banks/TTB.svg&quot;,weight:4}
        ];
        const prefixes=[&quot;06&quot;,&quot;08&quot;,&quot;09&quot;];
        const totalWeight=banks.reduce((s,b)=&gt;s+b.weight,0);
        const randNum=(min,max)=&gt;Math.floor(Math.random()*(max-min+1))+min;
        const pickBank=()=&gt;{let r=Math.random()*totalWeight;for(const bank of banks){if((r-=bank.weight)&lt;=0)return bank}return banks[banks.length-1]};
        const generateUser=()=&gt;{const prefix=prefixes[randNum(0,prefixes.length-1)];return `${prefix}${randNum(0,9)}-XXX-XX${randNum(10,99)}`};
        const generateAmount=()=&gt;randNum(300,10000).toLocaleString(&quot;th-TH&quot;);
        const formatDateTime=()=&gt;{const now=new Date();return `${now.toLocaleDateString(&quot;th-TH&quot;,{day:&quot;2-digit&quot;,month:&quot;short&quot;,year:&quot;numeric&quot;})} ${now.toLocaleTimeString(&quot;th-TH&quot;,{hour:&quot;2-digit&quot;,minute:&quot;2-digit&quot;,second:&quot;2-digit&quot;})}`};

        const createCard=()=&gt;{
          const bank=pickBank(), user=generateUser(), amount=generateAmount(), dateTime=formatDateTime();
          const card=document.createElement(&quot;div&quot;);
          card.className=&quot;withdrawal-card&quot;;
          card.innerHTML=`&lt;div class=&quot;withdrawal-card__bank&quot;&gt;&lt;img class=&quot;withdrawal-card__bank-img&quot; src=&quot;${bank.img}&quot; alt=&quot;${bank.code}&quot; onerror=&quot;this.onerror=null;this.src=\'${bank.fallback}\';&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;withdrawal-card__body&quot;&gt;&lt;div class=&quot;withdrawal-card__row&quot;&gt;&lt;span class=&quot;withdrawal-card__label&quot;&gt;ยูสเซอร์:&lt;/span&gt;&lt;span class=&quot;withdrawal-card__user&quot;&gt;${user}&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;withdrawal-card__row&quot;&gt;&lt;span class=&quot;withdrawal-card__label&quot;&gt;ยอดถอน:&lt;/span&gt;&lt;span class=&quot;withdrawal-card__amount&quot;&gt;${amount} บาท&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;withdrawal-card__time&quot;&gt;${dateTime}&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;withdrawal-card__status&quot;&gt;&lt;i class=&quot;fa-solid fa-spinner fa-spin&quot;&gt;&lt;/i&gt; กำลังโอน...&lt;/div&gt;`;
          setTimeout(()=&gt;{const status=card.querySelector(&quot;.withdrawal-card__status&quot;);status.className=&quot;withdrawal-card__status withdrawal-card__status--complete&quot;;status.innerHTML='&lt;i class=&quot;fa-solid fa-circle-check&quot;&gt;&lt;/i&gt; โอนแล้ว'},randNum(config.completeTime.min,config.completeTime.max));
          return card;
        };

        const addCard=()=&gt;{const list=document.getElementById(&quot;withdrawalList&quot;);if(!list)return;list.insertBefore(createCard(),list.firstChild);while(list.children.length&gt;config.maxRows)list.removeChild(list.lastChild)};
        for(let i=0;i&lt;config.maxRows;i++)addCard();
        setInterval(addCard,config.addInterval);
      })();

      const ALL_GAMES_LINK=&quot;https://mssq.me/jqo1K3&quot;;

      /* ===== Win-rate demo ===== */
      (function(){
        const grid=document.getElementById(&quot;win-rate-grid&quot;); if(!grid)return;
        /* รูปเกม 16 รูปฝังในไฟล์ HTML โดยตรง เพื่อไม่ให้ Path แตก */
        const IMAGES=[
          &quot;assets/image_002.jpg&quot; /* dragon-hatch-2.jpg */,
          &quot;assets/image_003.jpg&quot; /* dragon-hatch.jpg */,
          &quot;assets/image_004.jpg&quot; /* dragons-treasure-quest.jpg */,
          &quot;assets/image_005.jpg&quot; /* fortune-ox.jpg */,
          &quot;assets/image_006.jpg&quot; /* fortune-rabbit.jpg */,
          &quot;assets/image_007.jpg&quot; /* fortune-snake.jpg */,
          &quot;assets/image_008.jpg&quot; /* fortune-tiger.jpg */,
          &quot;assets/image_009.jpg&quot; /* ganesha-gold.jpg */,
          &quot;assets/image_010.jpg&quot; /* caishen-wins.jpg */,
          &quot;assets/image_011.jpg&quot; /* mahjong-ways-2.jpg */,
          &quot;assets/image_012.jpg&quot; /* treasures-of-aztec.jpg */,
          &quot;assets/image_013.jpg&quot; /* ways-of-the-qilin.jpg */,
          &quot;assets/image_014.jpg&quot; /* wild-bandito.jpg */,
          &quot;assets/image_015.jpg&quot; /* wild-coaster.jpg */,
          &quot;assets/image_016.jpg&quot; /* wild-heist-cashout.jpg */,
          &quot;assets/image_017.jpg&quot; /* lucky-neko.jpg */
        ];
        const randSec=()=&gt;Math.floor(10+Math.random()*290);
        const randPct=()=&gt;Math.floor(70+Math.random()*31);
        const mmss=s=&gt;`${String(Math.floor(s/60)).padStart(2,&quot;0&quot;)}:${String(s%60).padStart(2,&quot;0&quot;)}`;
        const cards=[];
        const pick=(used,current=&quot;&quot;)=&gt;{let pool=IMAGES.filter(u=&gt;!used.has(u)&amp;&amp;u!==current);if(!pool.length)pool=IMAGES.filter(u=&gt;!used.has(u));return pool[Math.floor(Math.random()*pool.length)]||IMAGES[0]};

        function createCard(){
          const card=document.createElement(&quot;div&quot;);card.className=&quot;win-rate-card&quot;;
          card.innerHTML=`&lt;div class=&quot;win-rate-card__thumb&quot;&gt;&lt;img class=&quot;win-rate-card__img&quot; src=&quot;&quot; alt=&quot;รูปเกม&quot; loading=&quot;lazy&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;win-rate-card__label&quot;&gt;อัตราชนะของเกม&lt;/div&gt;
          &lt;div class=&quot;win-rate-card__bar-box&quot;&gt;&lt;div class=&quot;win-rate-card__bar-fill&quot;&gt;&lt;/div&gt;&lt;div class=&quot;win-rate-card__bar-text&quot;&gt;0%&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;win-rate-card__countdown&quot;&gt;จะหมดเวลาใน 00:00 นาที&lt;/div&gt;`;
          grid.appendChild(card);
          return {card,img:card.querySelector(&quot;img&quot;),fill:card.querySelector(&quot;.win-rate-card__bar-fill&quot;),txt:card.querySelector(&quot;.win-rate-card__bar-text&quot;),cd:card.querySelector(&quot;.win-rate-card__countdown&quot;),remain:randSec()};
        }
        for(let i=0;i&lt;6;i++)cards.push(createCard());
        const used=new Set();
        cards.forEach(c=&gt;{const src=pick(used);c.img.src=src;used.add(src);const v=randPct();c.fill.style.width=v+&quot;%&quot;;c.txt.textContent=v+&quot;%&quot;});
        setInterval(()=&gt;cards.forEach(c=&gt;{
          c.remain=Math.max(0,c.remain-1);
          c.cd.textContent=`จะหมดเวลาใน ${mmss(c.remain)} นาที`;
          if(c.remain===0){
            const others=new Set(cards.filter(x=&gt;x!==c).map(x=&gt;x.img.src));
            c.img.style.opacity=0;
            setTimeout(()=&gt;{c.img.src=pick(others,c.img.src);c.img.style.opacity=1},400);
            const v=randPct();c.fill.style.width=v+&quot;%&quot;;c.txt.textContent=v+&quot;%&quot;;c.remain=randSec();
          }
        }),1000);
      })();

&lt;section class=&quot;card hero&quot;&gt;
  &lt;div class=&quot;brand&quot;&gt;Rareone&lt;/div&gt;
  &lt;div class=&quot;eyebrow&quot;&gt;INFORMATION • SUPPORT • SERVICE&lt;/div&gt;
  &lt;h1 data-i18n=&quot;hero_title&quot;&gt;ข้อมูลบริการและช่องทางช่วยเหลือ&lt;/h1&gt;
  &lt;p data-i18n=&quot;hero_desc&quot;&gt;เว็บไซต์นี้จัดทำขึ้นเพื่ออธิบายข้อมูลบริการ วิธีใช้งานทั่วไป และช่องทางการสนับสนุนอย่างชัดเจนก่อนตัดสินใจใช้งาน&lt;/p&gt;
  &lt;div class=&quot;btns&quot;&gt;
    &lt;a class=&quot;btn primary&quot; href=&quot;#service&quot; data-i18n=&quot;service_btn&quot;&gt;ดูรายละเอียดบริการ&lt;/a&gt;
    &lt;a class=&quot;btn secondary&quot; href=&quot;#help&quot; data-i18n=&quot;help_btn&quot;&gt;ศูนย์ช่วยเหลือ&lt;/a&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;service&quot; class=&quot;card&quot;&gt;
  &lt;h2 data-i18n=&quot;know_title&quot;&gt;ข้อมูลที่ควรรู้&lt;/h2&gt;
  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;item&quot;&gt;&lt;div class=&quot;icon&quot;&gt;ℹ️&lt;/div&gt;&lt;h3 data-i18n=&quot;clear_title&quot;&gt;ข้อมูลชัดเจน&lt;/h3&gt;&lt;p data-i18n=&quot;clear_desc&quot;&gt;สรุปขอบเขตบริการและรายละเอียดการใช้งานในภาษาที่อ่านง่าย&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;item&quot;&gt;&lt;div class=&quot;icon&quot;&gt;🔒&lt;/div&gt;&lt;h3 data-i18n=&quot;privacy_title&quot;&gt;ความเป็นส่วนตัว&lt;/h3&gt;&lt;p data-i18n=&quot;privacy_desc&quot;&gt;ตรวจสอบข้อมูลเว็บไซต์และหลีกเลี่ยงการส่งข้อมูลส่วนตัวผ่านช่องทางที่ไม่น่าเชื่อถือ&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;item&quot;&gt;&lt;div class=&quot;icon&quot;&gt;💬&lt;/div&gt;&lt;h3 data-i18n=&quot;support_title&quot;&gt;การสนับสนุน&lt;/h3&gt;&lt;p data-i18n=&quot;support_desc&quot;&gt;มีข้อมูลช่วยเหลือและคำตอบสำหรับคำถามทั่วไปเกี่ยวกับการใช้งาน&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;card&quot;&gt;
  &lt;h2 data-i18n=&quot;details_title&quot;&gt;รายละเอียดบริการ&lt;/h2&gt;
  &lt;p class=&quot;note&quot; data-i18n=&quot;details_desc&quot;&gt;Rareone เป็นหน้าศูนย์ข้อมูลสำหรับแนะนำฟังก์ชันทั่วไป การใช้งานบนอุปกรณ์ต่าง ๆ และข้อมูลการช่วยเหลือ ผู้ใช้ควรอ่านรายละเอียดแต่ละส่วนก่อนใช้งานบริการที่เกี่ยวข้อง&lt;/p&gt;
  &lt;div class=&quot;grid&quot; style=&quot;margin-top:16px&quot;&gt;
    &lt;div class=&quot;item&quot;&gt;&lt;h3 data-i18n=&quot;device_title&quot;&gt;รองรับหลายอุปกรณ์&lt;/h3&gt;&lt;p data-i18n=&quot;device_desc&quot;&gt;ออกแบบให้เปิดอ่านได้บนมือถือ แท็บเล็ต และคอมพิวเตอร์&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;item&quot;&gt;&lt;h3 data-i18n=&quot;easy_title&quot;&gt;ใช้งานง่าย&lt;/h3&gt;&lt;p data-i18n=&quot;easy_desc&quot;&gt;โครงสร้างข้อมูลตรงไปตรงมาและนำทางได้สะดวก&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;item&quot;&gt;&lt;h3 data-i18n=&quot;helpinfo_title&quot;&gt;ข้อมูลช่วยเหลือ&lt;/h3&gt;&lt;p data-i18n=&quot;helpinfo_desc&quot;&gt;รวมคำแนะนำพื้นฐานและคำถามที่พบบ่อยไว้ในหน้าเดียว&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section id=&quot;help&quot; class=&quot;card faq&quot;&gt;
  &lt;h2 data-i18n=&quot;faq_title&quot;&gt;คำถามที่พบบ่อย&lt;/h2&gt;
  &lt;details open&gt;&lt;summary data-i18n=&quot;faq1_q&quot;&gt;เว็บไซต์นี้ใช้ทำอะไร?&lt;/summary&gt;&lt;p data-i18n=&quot;faq1_a&quot;&gt;ใช้สำหรับแสดงข้อมูลบริการ แนวทางการใช้งาน และข้อมูลช่วยเหลือทั่วไป&lt;/p&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary data-i18n=&quot;faq2_q&quot;&gt;ใช้งานบนมือถือได้หรือไม่?&lt;/summary&gt;&lt;p data-i18n=&quot;faq2_a&quot;&gt;ได้ หน้าเว็บไซต์รองรับหน้าจอมือถือ แท็บเล็ต และเดสก์ท็อป&lt;/p&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary data-i18n=&quot;faq3_q&quot;&gt;ควรตรวจสอบอะไรบ้างก่อนใช้งาน?&lt;/summary&gt;&lt;p data-i18n=&quot;faq3_a&quot;&gt;ควรตรวจสอบชื่อเว็บไซต์ รายละเอียดบริการ นโยบายความเป็นส่วนตัว และข้อมูลการติดต่อให้ตรงกับแหล่งที่คุณตั้งใจใช้งาน&lt;/p&gt;&lt;/details&gt;
&lt;/section&gt;

&lt;section class=&quot;card&quot;&gt;
  &lt;h2 data-i18n=&quot;policy_title&quot;&gt;นโยบายและความโปร่งใส&lt;/h2&gt;
  &lt;div class=&quot;notice&quot; data-i18n=&quot;notice&quot;&gt;เนื้อหาบริการหลักเหมือนกันทุกพื้นที่ โดยระบบอาจเลือกภาษาที่เหมาะสมตามประเทศของผู้เข้าชมเพื่อให้อ่านข้อมูลได้สะดวกขึ้น&lt;/div&gt;
  &lt;div class=&quot;grid&quot; style=&quot;margin-top:16px&quot;&gt;

    &lt;div class=&quot;item&quot;&gt;&lt;h3 data-i18n=&quot;p2_title&quot;&gt;เงื่อนไขการใช้งาน&lt;/h3&gt;&lt;p class=&quot;small&quot; data-i18n=&quot;p2_desc&quot;&gt;อ่านข้อกำหนดของบริการที่เกี่ยวข้องให้ครบถ้วนก่อนเริ่มใช้งาน&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;item&quot;&gt;&lt;h3 data-i18n=&quot;p3_title&quot;&gt;ความปลอดภัย&lt;/h3&gt;&lt;p class=&quot;small&quot; data-i18n=&quot;p3_desc&quot;&gt;อย่าแชร์รหัสผ่านหรือข้อมูลสำคัญผ่านช่องทางที่ไม่สามารถยืนยันตัวตนได้&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;
